{% load i18n %}
<div class="maker wg21-poster">
    {% if rank %}
        <div class="wg21-poster__rank" aria-hidden="true">#{{ rank }}</div>
    {% endif %}
    {% include 'hyperkitty/fragments/wg21_poster_avatar.html' with name=name only %}
    <div class="gravatar-details wg21-poster__meta">
        <span class="maker-name">
            {% if profile_url %}
            <a href="{{ profile_url }}" title="{% trans 'See the profile' %}">{{ name }}</a>
            {% else %}
                {{ name }}
            {% endif %}
        </span>
        {% if score_label %}
        <span class="score">{{ score_prefix }}{{ score }} {{ score_label }}</span>
        {% endif %}
    </div>
</div>
