services:
  mailman-core:
    image: maxking/mailman-core:0.5.2
    container_name: wg21-mailman-core
    hostname: mailman-core
    restart: unless-stopped
    volumes:
      - core_data:/opt/mailman/
    stop_grace_period: 30s
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mailman:mailmanpass@database/mailmandb
      - DATABASE_TYPE=postgres
      - DATABASE_CLASS=mailman.database.postgresql.PostgreSQLDatabase
      - HYPERKITTY_API_KEY=${HYPERKITTY_API_KEY:-devhyperkittyapikey}
    ports:
      - "127.0.0.1:8101:8001" # Mailman core REST API
      - "127.0.0.1:8124:8024" # LMTP - incoming mail
    networks:
      mailman:

  mailman-web:
    image: maxking/mailman-web:0.5.2
    container_name: wg21-mailman-web
    hostname: mailman-web
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      mailman-core:
        condition: service_started
    volumes:
      - web_data:/opt/mailman-web-data
      # Serve /static/ without nginx (production uses nginx for this).
      - ./local/uwsgi.ini:/opt/mailman-web/uwsgi.ini:ro
      # Production URL paths: /mailman3/ (Postorius), /archives/ (HyperKitty).
      - ./local/urls.py:/opt/mailman-web/urls.py:ro
      # Prod-faithful overrides: register static_custom + templates DIRS.
      - ./local/settings_local.py:/opt/mailman-web/settings_local.py:ro
      # Seed helper.
      - ./scripts:/opt/wg21-scripts:ro
      # --- wg21 redesign overrides (static_custom + templates) ---
      # Mounted OUTSIDE /opt/mailman-web-data so the entrypoint's `chown -R`
      # over the data dir does not choke on these read-only mounts. The wg21/
      # static namespace is served live by uwsgi via a dedicated static-map
      # (see local/uwsgi.ini); templates are picked up via TEMPLATES DIRS.
      # Per-app static overrides (postorius/hyperkitty) are added here only
      # when such a file actually exists.
      - ./wg21/static/wg21:/opt/wg21-custom/static_custom/wg21:ro
      - ./wg21/templates/wg21:/opt/wg21-custom/templates/wg21:ro
      - ./postorius/templates/postorius:/opt/wg21-custom/templates/postorius:ro
      - ./hyperkitty/templates/hyperkitty:/opt/wg21-custom/templates/hyperkitty:ro
    environment:
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://mailman:mailmanpass@database/mailmandb
      - HYPERKITTY_API_KEY=${HYPERKITTY_API_KEY:-devhyperkittyapikey}
      - SECRET_KEY=${SECRET_KEY:-dev-only-insecure-secret-change-me}
      - SERVE_FROM_DOMAIN=${SERVE_FROM_DOMAIN:-lists.example.com}
      - MAILMAN_ADMIN_USER=${MAILMAN_ADMIN_USER:-admin}
      - MAILMAN_ADMIN_EMAIL=${MAILMAN_ADMIN_EMAIL:-admin@example.com}
    ports:
      - "127.0.0.1:8300:8000" # HTTP (open this in the browser)
      - "127.0.0.1:8380:8080" # uwsgi
    networks:
      mailman:

  database:
    image: postgres:12-alpine
    container_name: wg21-mailman-database
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mailmandb
      - POSTGRES_USER=mailman
      - POSTGRES_PASSWORD=mailmanpass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname mailmandb --username mailman"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      mailman:

networks:
  mailman:
    driver: bridge

volumes:
  core_data:
  web_data:
  db_data:
